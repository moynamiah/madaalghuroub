name: One-time complete npm lockfile repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'sync/moyna-final-source-20261125'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/moyna-final-source-20261125
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Regenerate complete cross-platform lockfile
        run: npm install --no-audit --no-fund
      - name: Verify clean locked installation
        run: npm ci --no-audit --no-fund
      - name: Commit verified lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already valid"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: complete npm optional dependency lock and verify npm ci"
          git push origin HEAD:refs/heads/sync/moyna-final-source-20261125
