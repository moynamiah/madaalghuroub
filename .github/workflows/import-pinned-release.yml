# One-time, pinned import for the user's validated AI Studio release.
# This workflow must not be generalized to download arbitrary ZIP URLs.
name: Import pinned Moyna profile release
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: moyna-final-import
  cancel-in-progress: false

jobs:
  import:
    if: github.event.release.tag_name == 'moyna-final-import-20261124'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify original main and rollback branch
        shell: bash
        run: |
          set -euo pipefail
          BASE=0224fc3a13bf4e8303aee47fdac9efcc233cbd52
          git merge-base --is-ancestor "$BASE" HEAD
          changed="$(git diff --name-only "$BASE"..HEAD)"
          if [ "$changed" != ".github/workflows/import-pinned-release.yml" ]; then
            echo "::error::Main changed after import setup; refusing an unsafe update."
            exit 1
          fi
          backup="$(git ls-remote origin refs/heads/backup/main-before-final-sync-20261124 | cut -f1)"
          if [ "$backup" != "$BASE" ]; then
            echo "::error::Verified rollback branch missing or changed."
            exit 1
          fi

      - name: Download the exact verified release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/moyna-incoming"
          gh release download moyna-final-import-20261124 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'madaalghuroub-professional-final-release.zip' \
            --dir "$RUNNER_TEMP/moyna-incoming"
          echo '3df0273e14a38646a6ccd0b2621d13d2f35de6ac22f81f8dd7033c1773529ded  madaalghuroub-professional-final-release.zip' \
            | (cd "$RUNNER_TEMP/moyna-incoming" && sha256sum -c -)

      - name: Extract and verify source manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/moyna-source"
          python3 - <<'PY'
          import os, zipfile, pathlib, stat
          root = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          source = root / "moyna-incoming" / "madaalghuroub-professional-final-release.zip"
          dest = root / "moyna-source"
          with zipfile.ZipFile(source) as z:
              if z.testzip() is not None: raise SystemExit("Corrupt ZIP")
              names = [v.filename for v in z.infolist() if not v.is_dir()]
              if len(names) != 70 or len(names) != len(set(names)):
                  raise SystemExit("Unexpected archive inventory")
              for item in z.infolist():
                  name = item.filename
                  if (name.startswith("/") or "\\" in name or
                      ".." in pathlib.PurePosixPath(name).parts or
                      name.startswith(".git/") or name == ".git" or
                      stat.S_ISLNK((item.external_attr >> 16) & 0xffff)):
                      raise SystemExit("Unsafe archive entry")
                  if not (dest / name).resolve().is_relative_to(dest.resolve()):
                      raise SystemExit("Path traversal rejected")
              z.extractall(dest)
          PY
          (cd "$RUNNER_TEMP/moyna-source" && sha256sum -c SOURCE_MANIFEST.sha256)
          test -f "$RUNNER_TEMP/moyna-source/src/App.tsx"
          test -f "$RUNNER_TEMP/moyna-source/package-lock.json"
          test -f "$RUNNER_TEMP/moyna-source/public/.htaccess"

      - name: Apply release in the runner, preserving Git history
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' "$RUNNER_TEMP/moyna-source/" "./"
          git status --short

      - name: Set up compatible Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Security and RFQ unit tests
        run: npm test

      - name: Fail on high or critical npm advisories
        run: npm audit --audit-level=high

      - name: Build Hostinger production files
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Verify static release
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/robots.txt
          test -d dist/assets

      - name: Commit and push only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::No release changes detected."
            exit 1
          fi
          git commit -m "feat: import optimized Moyna profile and security fixes"
          git push origin HEAD:refs/heads/main
