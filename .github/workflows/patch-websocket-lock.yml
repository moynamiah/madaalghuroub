name: One-time websocket-driver security patch

on:
  push:
    branches:
      - security/websocket-driver-20261125
    paths:
      - package.json

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Node.js 24.12
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm

      - name: Update lockfile for the pinned dependency
        run: |
          node --input-type=commonjs -e "const p=require('./package.json'); if (p.overrides['websocket-driver'] !== '^0.8.0') process.exit(1)"
          npm install --package-lock-only --ignore-scripts --no-fund

      - name: Check resolved patched websocket-driver
        run: |
          node --input-type=commonjs - <<'NODE'
          const p = require('./package-lock.json').packages['node_modules/websocket-driver'];
          if (!p || p.version !== '0.8.0') {
            throw new Error('Expected patched websocket-driver@0.8.0, got ' + (p?.version ?? 'missing'));
          }
          console.log('Patched websocket-driver:', p.version);
          NODE

      - name: Clean dependency install
        run: npm ci --no-fund

      - name: Verify TypeScript
        run: npm run lint

      - name: Verify tests
        run: npm test

      - name: Check all dependency advisories
        run: npm audit --audit-level=high

      - name: Build Hostinger static website
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Verify build files
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/robots.txt
          test -d dist/assets

      - name: Commit verified lockfile and retire one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/patch-websocket-lock.yml
          git commit -m "security: refresh npm lockfile for websocket-driver 0.8.0"
          git push origin HEAD:refs/heads/security/websocket-driver-20261125
